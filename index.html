<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransformWithHari — Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #F9F6F1;
  --surface: #FFFFFF;
  --dark: #1C1C2E;
  --accent: #E8520A;
  --yt: #FF0000;
  --fb: #1877F2;
  --ig: #E1306C;
  --border: #E8E3DC;
  --muted: #888;
  --text: #2C2C2C;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

#login-screen {
  position: fixed; inset: 0;
  background: var(--dark);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  flex-direction: column;
}

.login-box {
  background: #fff;
  border-radius: 20px;
  padding: 48px 44px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.4);
}

.login-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; color: var(--dark); margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; }
.login-label { font-size: 12px; font-weight: 600; color: var(--dark); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }
.login-input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; margin-bottom: 16px; }
.login-input:focus { border-color: var(--accent); }
.login-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.login-error { color: #e53e3e; font-size: 13px; margin-top: 10px; display: none; text-align: center; }

#app { display: none; }

.header { background: var(--dark); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 800; color: #fff; }
.header-logo span { color: var(--accent); }
.add-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.logout-btn { background: transparent; color: #aaa; border: 1px solid #444; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.header-right { display: flex; align-items: center; gap: 12px; }

.filters { padding: 20px 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
.filter-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-right: 4px; }
.filter-btn { padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); }
.filter-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }
.filter-btn.yt.active { background: var(--yt); border-color: var(--yt); }
.filter-btn.fb.active { background: var(--fb); border-color: var(--fb); }
.filter-btn.ig.active { background: var(--ig); border-color: var(--ig); }

.stats-bar { padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 24px; flex-wrap: wrap; }
.stat-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; }
.stat-count { font-weight: 700; color: var(--dark); }
.stat-label { color: var(--muted); }

.calendar-wrap { padding: 28px 32px; }
.month-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--dark); margin-bottom: 20px; }
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 8px; }
.week-day { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; padding: 8px 0; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

.cal-day { background: var(--surface); border-radius: 12px; border: 1.5px solid var(--border); height: 130px; padding: 10px; position: relative; overflow: hidden; }
.cal-day.empty { background: transparent; border-color: transparent; }
.cal-day.today { border-color: var(--accent); }
.cal-day-num { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
.today-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
.cal-day-add { width: 20px; height: 20px; border-radius: 50%; background: var(--border); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); line-height: 1; }
.cal-day-add:hover { background: var(--accent); color: #fff; }

.post-chip { display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; font-size: 11px; font-weight: 500; line-height: 1.3; }
.post-chip.youtube { background: #FFF0F0; color: #CC0000; }
.post-chip.facebook { background: #EEF4FF; color: #1565C0; }
.post-chip.instagram { background: #FFF0F6; color: #B5006A; }
.platform-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.platform-dot.youtube { background: var(--yt); }
.platform-dot.facebook { background: var(--fb); }
.platform-dot.instagram { background: var(--ig); }
.chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.more-posts { font-size: 10px; color: var(--muted); font-weight: 600; padding: 2px 4px; cursor: pointer; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 20px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 40px 80px rgba(0,0,0,0.3); }
.modal-header { padding: 24px 28px 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--dark); }
.modal-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--border); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 0 28px 28px; }
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--dark); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 7px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; background: #fff; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }
.platform-btns { display: flex; gap: 8px; }
.platform-toggle { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid var(--border); background: transparent; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); }
.platform-toggle.selected.youtube { border-color: var(--yt); background: #FFF0F0; color: var(--yt); }
.platform-toggle.selected.facebook { border-color: var(--fb); background: #EEF4FF; color: var(--fb); }
.platform-toggle.selected.instagram { border-color: var(--ig); background: #FFF0F6; color: var(--ig); }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.btn-primary { flex: 1; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.btn-danger { padding: 12px 20px; background: #FFF0F0; color: #e53e3e; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.btn-secondary { padding: 12px 20px; background: var(--border); color: var(--text); border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }

.view-platform-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
.view-platform-badge.youtube { background: #FFF0F0; color: var(--yt); }
.view-platform-badge.facebook { background: #EEF4FF; color: var(--fb); }
.view-platform-badge.instagram { background: #FFF0F6; color: var(--ig); }
.view-field { margin-bottom: 14px; }
.view-field-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.view-field-value { font-size: 14px; color: var(--text); line-height: 1.5; }
.view-field-value.title { font-size: 16px; font-weight: 600; color: var(--dark); }

@keyframes loadpulse { from { opacity: 0.4; } to { opacity: 1; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Transform<span style="color:var(--accent)">WithHari</span></div>
    <div class="login-sub">Content Calendar — Private Access</div>
    <label class="login-label">Password</label>
    <input type="password" class="login-input" id="pwd-input" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Access Calendar</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<div id="app">
  <div id="loading-bar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--accent);height:3px;animation:loadpulse 1s infinite alternate;"></div>
  <div class="header">
    <div class="header-logo">Transform<span>WithHari</span> <span style="font-size:13px;color:#888;font-family:'DM Sans';font-weight:400;margin-left:8px;">Content Calendar</span></div>
    <div class="header-right">
      <button class="add-btn" onclick="openAddModal()">+ Add Post</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="filters">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn yt" onclick="setFilter('youtube', this)">YouTube</button>
    <button class="filter-btn fb" onclick="setFilter('facebook', this)">Facebook</button>
    <button class="filter-btn ig" onclick="setFilter('instagram', this)">Instagram</button>
  </div>
  <div class="calendar-wrap">
    <div class="month-title" id="month-title"></div>
    <div class="week-days">
      <div class="week-day">Sun</div><div class="week-day">Mon</div><div class="week-day">Tue</div>
      <div class="week-day">Wed</div><div class="week-day">Thu</div><div class="week-day">Fri</div><div class="week-day">Sat</div>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title-text">Add Post</div>
      <button class="modal-close" onclick="closeModal('add-modal')">x</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label class="form-label">Platform</label>
        <div class="platform-btns">
          <button class="platform-toggle youtube" id="btn-yt" onclick="selectPlatform('youtube')">YouTube</button>
          <button class="platform-toggle facebook" id="btn-fb" onclick="selectPlatform('facebook')">Facebook</button>
          <button class="platform-toggle instagram" id="btn-ig" onclick="selectPlatform('instagram')">Instagram</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="post-date">
      </div>
      <div class="form-group">
        <label class="form-label">Content Type</label>
        <select class="form-select" id="post-type">
          <option value="">Select type...</option>
          <option value="Long-Form Video">Long-Form Video</option>
          <option value="YouTube Short">YouTube Short</option>
          <option value="Reel">Reel</option>
          <option value="Image Post">Image Post</option>
          <option value="Story">Story</option>
          <option value="Carousel">Carousel</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Title / Topic</label>
        <input type="text" class="form-input" id="post-title" placeholder="e.g. How I Lost 20kg Without a Gym">
      </div>
      <div class="form-group">
        <label class="form-label">Notes / Hook / CTA</label>
        <textarea class="form-textarea" id="post-notes" placeholder="Add your hook, CTA, caption notes..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="post-status">
          <option value="planned">Planned</option>
          <option value="filmed">Filmed</option>
          <option value="edited">Edited</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div class="modal-actions" id="modal-actions">
        <button class="btn-primary" onclick="savePost()">Save Post</button>
        <button class="btn-secondary" onclick="closeModal('add-modal')">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="view-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Post Details</div>
      <button class="modal-close" onclick="closeModal('view-modal')">x</button>
    </div>
    <div class="modal-body" id="view-modal-body"></div>
  </div>
</div>

<script>
const PASSWORD = 'Success@2026';
const BIN_ID = '69b3de62aa77b81da9df482b';
const API_KEY = '$2a$10$y7oP6xdCxx0.p.S95No0QO3S/2rLxq3aCK74m/1mvopVdYkGUtF0.';
const BIN_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

let posts = [];
let currentFilter = 'all';
let selectedPlatform = 'youtube';
let editingId = null;
let currentMonth = new Date();
currentMonth.setDate(1);

function doLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('twh_auth', '1');
    initData();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem('twh_auth');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

if (sessionStorage.getItem('twh_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initData();
}

async function loadData() {
  try {
    showLoading(true);
    const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Access-Key': API_KEY } });
    const data = await res.json();
    posts = data.record.posts || [];
  } catch(e) { posts = []; } finally { showLoading(false); }
}

async function saveData() {
  try {
    await fetch(BIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': API_KEY },
      body: JSON.stringify({ posts: posts })
    });
  } catch(e) { console.error('Save failed', e); }
}

function showLoading(show) {
  const el = document.getElementById('loading-bar');
  if (el) el.style.display = show ? 'block' : 'none';
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCalendar();
}

function selectPlatform(p) {
  selectedPlatform = p;
  document.getElementById('btn-yt').classList.remove('selected');
  document.getElementById('btn-fb').classList.remove('selected');
  document.getElementById('btn-ig').classList.remove('selected');
  const map = { youtube: 'btn-yt', facebook: 'btn-fb', instagram: 'btn-ig' };
  document.getElementById(map[p]).classList.add('selected');
}

function openAddModal(date) {
  editingId = null;
  selectedPlatform = 'youtube';
  document.getElementById('modal-title-text').textContent = 'Add Post';
  document.getElementById('edit-id').value = '';
  document.getElementById('post-date').value = date || getTodayStr();
  document.getElementById('post-title').value = '';
  document.getElementById('post-notes').value = '';
  document.getElementById('post-type').value = '';
  document.getElementById('post-status').value = 'planned';
  document.getElementById('btn-yt').classList.remove('selected');
  document.getElementById('btn-fb').classList.remove('selected');
  document.getElementById('btn-ig').classList.remove('selected');
  document.getElementById('btn-yt').classList.add('selected');
  document.getElementById('modal-actions').innerHTML = '<button class="btn-primary" onclick="savePost()">Save Post</button><button class="btn-secondary" onclick="closeModal(\'add-modal\')">Cancel</button>';
  document.getElementById('add-modal').classList.add('open');
}

function openEditModal(id) {
  closeModal('view-modal');
  const post = posts.find(p => p.id === id);
  if (!post) return;
  editingId = id;
  selectedPlatform = post.platform;
  document.getElementById('modal-title-text').textContent = 'Edit Post';
  document.getElementById('post-date').value = post.date;
  document.getElementById('post-title').value = post.title;
  document.getElementById('post-notes').value = post.notes || '';
  document.getElementById('post-type').value = post.type || '';
  document.getElementById('post-status').value = post.status || 'planned';
  document.getElementById('btn-yt').classList.remove('selected');
  document.getElementById('btn-fb').classList.remove('selected');
  document.getElementById('btn-ig').classList.remove('selected');
  const map = { youtube: 'btn-yt', facebook: 'btn-fb', instagram: 'btn-ig' };
  document.getElementById(map[post.platform]).classList.add('selected');
  document.getElementById('modal-actions').innerHTML = '<button class="btn-primary" onclick="savePost()">Update Post</button><button class="btn-danger" onclick="deletePost(\'' + id + '\')">Delete</button><button class="btn-secondary" onclick="closeModal(\'add-modal\')">Cancel</button>';
  document.getElementById('add-modal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function savePost() {
  const title = document.getElementById('post-title').value.trim();
  const date = document.getElementById('post-date').value;
  if (!title) { alert('Please add a title.'); return; }
  if (!date) { alert('Please select a date.'); return; }
  const post = { id: editingId || generateId(), platform: selectedPlatform, date, title, type: document.getElementById('post-type').value, notes: document.getElementById('post-notes').value.trim(), status: document.getElementById('post-status').value };
  if (editingId) { const idx = posts.findIndex(p => p.id === editingId); if (idx > -1) posts[idx] = { ...posts[idx], ...post }; }
  else { posts.push(post); }
  saveData().then(() => { closeModal('add-modal'); renderCalendar(); });
}

function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  posts = posts.filter(p => p.id !== id);
  saveData().then(() => { closeModal('add-modal'); closeModal('view-modal'); renderCalendar(); });
}

function viewPost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;
  const platformLabel = { youtube: 'YouTube', facebook: 'Facebook', instagram: 'Instagram' };
  document.getElementById('view-modal-body').innerHTML =
    '<div class="view-platform-badge ' + post.platform + '">' + platformLabel[post.platform] + '</div>' +
    '<div class="view-field"><div class="view-field-label">Title</div><div class="view-field-value title">' + post.title + '</div></div>' +
    '<div class="view-field"><div class="view-field-label">Date</div><div class="view-field-value">' + formatDate(post.date) + '</div></div>' +
    (post.type ? '<div class="view-field"><div class="view-field-label">Type</div><div class="view-field-value">' + post.type + '</div></div>' : '') +
    '<div class="view-field"><div class="view-field-label">Status</div><div class="view-field-value">' + post.status + '</div></div>' +
    (post.notes ? '<div class="view-field"><div class="view-field-label">Notes</div><div class="view-field-value">' + post.notes + '</div></div>' : '') +
    '<div class="modal-actions"><button class="btn-primary" onclick="openEditModal(\'' + post.id + '\')">Edit Post</button><button class="btn-danger" onclick="deletePost(\'' + post.id + '\')">Delete</button><button class="btn-secondary" onclick="closeModal(\'view-modal\')">Close</button></div>';
  document.getElementById('view-modal').classList.add('open');
}

function renderCalendar() {
  updateStats();
  const grid = document.getElementById('calendar-grid');
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('month-title').textContent = currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = getTodayStr();
  let html = '';
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const isToday = dateStr === today;
    const dayPosts = posts.filter(p => p.date === dateStr && (currentFilter === 'all' || p.platform === currentFilter));
    const maxShow = 2;
    const extra = dayPosts.length - maxShow;
    html += '<div class="cal-day ' + (isToday ? 'today' : '') + '"><div class="cal-day-num"><span>' + d + '</span><div style="display:flex;align-items:center;gap:4px;">' + (isToday ? '<div class="today-dot"></div>' : '') + '<button class="cal-day-add" onclick="openAddModal(\'' + dateStr + '\')" title="Add post">+</button></div></div>';
    dayPosts.slice(0, maxShow).forEach(post => {
      html += '<div class="post-chip ' + post.platform + '" onclick="viewPost(\'' + post.id + '\')" title="' + post.title + '"><div class="platform-dot ' + post.platform + '"></div><span class="chip-text">' + post.title + '</span></div>';
    });
    if (extra > 0) html += '<div class="more-posts">+' + extra + ' more</div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function updateStats() {
  const yt = posts.filter(p => p.platform === 'youtube').length;
  const fb = posts.filter(p => p.platform === 'facebook').length;
  const ig = posts.filter(p => p.platform === 'instagram').length;
  const pub = posts.filter(p => p.status === 'published').length;

    '<div class="stat-item"><div class="stat-dot" style="background:var(--ig)"></div><span class="stat-count">' + ig + '</span><span class="stat-label">Instagram</span></div>' +
    '<div class="stat-item"><div class="stat-dot" style="background:#10B981"></div><span class="stat-count">' + pub + '</span><span class="stat-label">Published</span></div>' +
    '<div class="stat-item" style="margin-left:auto;"><span class="stat-count">' + posts.length + '</span><span class="stat-label" style="margin-left:4px;">Total Posts</span></div>';
}

function getTodayStr() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
function formatDate(dateStr) { return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }
